<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<form id="adoption-form">
<h1>Dog Adoption Application</h1>
<label for="name">Name</label>
<input id="name" type="text" placeholder="Name">
<label for="phone">Phone Number</label>
<input id="phone" type="text" placeholder="Phone Number">
<label for="address">Address</label>
<input id="address" type="text" placeholder="Address">
<label for="checkbox"><input id="checkbox" type="checkbox" value="Have you ever lived with a Dog before?"> Have you ever lived with a Dog before?</label>
<label for="multiSelect">Please select your preferred breeds</label>
<select id="multiSelect" multiple>
<option>Beagle</option><option>Labrador</option><option>Golden Retriever</option>
</select>
<button id="submit" type="submit" value="Submit">Submit</button>
</form>
<script type="text/javascript" src="./script.js"></script>
</body>
</html>
